name: Publish capture package
on:
  push:
    branches: [main]
    paths:
      - packages/capture/**
      - package.json
      - package-lock.json
      - scripts/check-capture-release.ts
      - .github/workflows/publish-capture.yml
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish-capture
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.15.0
      - run: npm ci
      - name: Check whether this version is already published
        id: release
        run: node --import tsx scripts/check-capture-release.ts
      - name: Test
        if: steps.release.outputs.publish == 'true'
        run: npm test
      - name: Build
        if: steps.release.outputs.publish == 'true'
        run: npm run build
      - name: Pack tested build
        if: steps.release.outputs.publish == 'true'
        run: npm pack --workspace @replayio/self-healing-capture --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Publish to npm
        if: steps.release.outputs.publish == 'true'
        env:
          # Optional bootstrap credential. Once npm trusts this workflow, OIDC needs no secret.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            unset NODE_AUTH_TOKEN
          fi
          npm publish "$RUNNER_TEMP/replayio-self-healing-capture-$VERSION.tgz" --access public
      - name: Verify published version
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            if npm view "@replayio/self-healing-capture@$VERSION" version; then
              exit 0
            fi
            sleep 5
          done
          exit 1
