[build]
  command = "npm run build"
  # GitHub Actions owns production; its CLI deploy uses --no-build.
  ignore = "exit 0"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

# Published skills are static assets; all other API paths always return JSON.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[headers]]
  for = "/api/v1/skills/*"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Dashboard navigation and refresh load the SPA, without rewriting unknown APIs.
[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dashboard/"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/dashboard*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
