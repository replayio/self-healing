<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Connect real user problems to verified fixes with FullStory, Replay QA, and Obvious."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/images/replay-logo.svg" />
    <title>Self Healing · From user problems to verified fixes</title>
    <script>
      // Apply stored theme before first paint to prevent flash (matches loop-qa's themeInitScript)
      (function(){try{var t=localStorage.getItem('replay_theme')||'system';var e=t;if(t!=='dark'&&t!=='light'){e=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',e);document.documentElement.classList.toggle('dark',e==='dark');}catch(e){}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
